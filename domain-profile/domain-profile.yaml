version: 0.1.0
status: draft
prepared_at: '2026-09-15T14:30:26Z'
research_cutoff: '2026-09-15'
title: Pension Credit decision makers guide discovery profile
description: Snapshot-bound experimental OKF+ discovery contract. Public research authorisation does not constitute
  DWP endorsement, expert approval or production conformance.
repository_lifecycle:
  classification: existing
  bootstrap_status: planned
  bootstrap_evidence:
  - okf.publication.json
  initial_commit_policy: Preserve the existing scaffold and its history. Record the public demonstrator as an explicit
    experimental change.
  default_branch: main
  feature_branch_policy: Use a task branch and reviewed pull request where supported; the user explicitly authorised
    public repository publication for this exemplar.
  required_checks:
  - Domain profile JSON Schema validation
  - Source inventory and PDF extraction reconciliation
  - Bundle syntax, links and source evidence
  - Actual Explorer load before claiming Explorer readiness
  ci_state: disabled-pending-validation
  source_paths:
  - source/
  - domain-profile/
  generated_paths:
  - bundle/
  - generated/
  remote_policy: The user explicitly authorises chris-page-gov/okf-dwp public publication; no wider publication
    or claimant-data use is authorised.
  handoff: Concurrent agents have disjoint paths. The root agent reconciles, validates and records the final commit.
intent:
  problem: Staff guidance is spread across chapter PDFs, change summaries and historical amendments; readers need
    to find and inspect relevant evidence without mistaking historical guidance for current law.
  desired_outcomes:
  - Demonstrate searchable source-linked chapter and paragraph evidence in OKF Explorer.
  - Expose an inspectable YAML-LD graph and JSON-LD projection for bounded AI retrieval.
  - Make authority, source versions, gaps and extraction limitations visible.
  non_goals:
  - Determine entitlement, calculate awards, recommend a claim decision or provide legal advice.
  - Claim complete coverage of Pension Credit law, DWP guidance, amendments or case law.
  - Process claimant personal data or simulate official DWP branding.
  target_okf_version: '0.2'
  risk_level: high
input_snapshot:
  locations:
  - https://www.gov.uk/government/publications/decision-makers-guide-vols-13-and-14-state-pension-credit-staff-guide
  - source/inventory.json
  snapshot_id: dmg-pension-credit-2026-09-15
  inventory_sha256: bf225f86a43959d45e59204d3de34dccba6590970626eb659038febca47889df
  item_count: 36
  byte_count: 23475769
  sampling_method: Census of document links on the named landing page; automated text extraction of acquired PDFs
    with sampled paragraph/source inspection.
  exclusions:
  - Other DMG volumes and separately published DMG memos are research references, not admitted corpus documents.
collection_profile:
  document_families:
  - Chapter PDFs, including transitional and spare chapters
  - Volume change summaries
  - Historical amendment PDFs
  - Collection landing page metadata
  formats:
  - application/pdf
  - text/html
  languages:
  - en-GB
  date_ranges:
  - Landing page first published 1 June 2013; observed update date 20 July 2026.
  - Historical documents and source paragraphs retain their own dates.
  representation_relationships:
  - A chapter work, its acquired PDF bytes, its extracted text and its generated page are distinct representations.
  - Historical amendments may repeat or replace text; they are not independent current rules.
  duplicate_policy: Keep all named source documents. Hash exact bytes; never deduplicate historical evidence by
    textual similarity.
  extraction_constraints:
  - PDF reading order, tables, cross-references, page furniture and footnotes may be imperfect.
  - Printed paragraph identifiers differ from PDF page indices; preserve both.
  - Spare chapters are retained as source-labelled placeholders.
  sensitivity_findings:
  - Only public staff guidance is admitted. No claimant records are requested or authorised.
  - Source examples are publisher illustrations, not project casework.
scope:
  record_definition: One named linked PDF is one inventory document. A generated passage or paragraph is a derived
    evidence unit with a document and locator; it is not a new source document.
  included:
  - The 36 PDF document links observed on the nominated landing page, subject to acquisition receipts.
  excluded:
  - Other benefits guides; unrelated departmental publications; claimant data.
  - Unlinked amending instruments, case law and DMG memos as corpus text; they remain declared research gaps.
  boundary_status: complete-against-declared-denominator
  denominators:
  - id: DEN-DOCUMENTS
    description: PDF document links on the nominated publication page
    value: 36
    as_of: '2026-09-15'
    basis: Exact source/inventory.json document list, reconciled to the source publication attachment census; all
      36 PDFs acquired and text-extracted.
    evidence_refs:
    - EV-COLLECTION
    - EV-INVENTORY
  unexplained_omissions: []
  snapshot_policy: snapshot-bounded
authority_model:
  source_authorities:
  - DWP is the publisher of the staff guide; the guide explains departmental decision-making practice.
  - Legislation.gov.uk publishes legislation with revision, commencement and outstanding-effects notices.
  semantic_authorities:
  - Preserve DWP chapter titles, paragraph numbers, abbreviations and source wording.
  - Local vocabulary is an editorial navigation aid, not a legally authoritative pension ontology.
  operational_authorities:
  - The chris-page-gov repository maintainer owns extraction, indexing and demonstration behaviour.
  decision_authorities:
  - DWP decision makers and the applicable review/appeal institutions retain their lawful functions.
  - The repository maintainer approves this experimental publication; a pensions representative can review domain
    interpretation.
