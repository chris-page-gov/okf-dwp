users:
- id: USER-REVIEWER
  role: Pensions representative or benefits guidance researcher
  context: User-supplied demonstration meeting on 15 September 2026.
  authority_requirement: Inspect official evidence and see clear historical/experimental boundaries.
  accessibility_language_needs:
  - British English, plain labels, keyboard-operable reader, source links.
  needs:
  - Find the relevant guidance and inspect provenance.
  - Review whether this representation preserves the source meaning.
  risks:
  - Mistaking a historical amendment for current guidance.
  - Treating an AI summary as an entitlement decision.
  evidence_refs:
  - EV-OWNER
- id: USER-AI
  role: AI or software consumer
  context: Querying the public demonstrator with source-linked retrieval.
  authority_requirement: Every factual answer must cite admitted source evidence; abstain outside the snapshot.
  accessibility_language_needs:
  - Explicit labels, stable identifiers and machine-readable caveats.
  needs:
  - Retrieve paragraphs with chapter identity, locator, derivation and source URL.
  risks:
  - Invented legal equivalence or ungrounded calculations.
  evidence_refs:
  - EV-OWNER
tasks:
- id: TASK-FIND
  user_ids:
  - USER-REVIEWER
  - USER-AI
  goal: Find guidance on capital, earnings or income other than earnings.
  context: Exploratory meeting demonstration.
  authority_requirement: Official source evidence, independent project presentation.
  required_evidence:
  - Source URL, document title and role, observation timestamp, source digest and precise locator.
  freshness_tolerance: The named 15 September 2026 snapshot only; no operational freshness claim.
  likely_confusions:
  - Pension Credit versus State Pension.
  - Document update date versus rule effective date.
  - Source paragraphs versus editorial labels.
  consequences_of_error:
  - Misdirected research or inappropriate reliance on historical content.
  hard_failures:
  - A personalised entitlement answer or unsupported law/conformance claim.
  success: The reader identifies the right chapter and can open its cited PDF.
- id: TASK-EVIDENCE
  user_ids:
  - USER-REVIEWER
  - USER-AI
  goal: Inspect an extracted paragraph and the source page that supports it.
  context: Exploratory meeting demonstration.
  authority_requirement: Official source evidence, independent project presentation.
  required_evidence:
  - Source URL, document title and role, observation timestamp, source digest and precise locator.
  freshness_tolerance: The named 15 September 2026 snapshot only; no operational freshness claim.
  likely_confusions:
  - Pension Credit versus State Pension.
  - Document update date versus rule effective date.
  - Source paragraphs versus editorial labels.
  consequences_of_error:
  - Misdirected research or inappropriate reliance on historical content.
  hard_failures:
  - A personalised entitlement answer or unsupported law/conformance claim.
  success: The source document, native paragraph identifier where available, page locator, digest and extraction
    caveat are visible.
- id: TASK-TIME
  user_ids:
  - USER-REVIEWER
  - USER-AI
  goal: Distinguish chapter guidance, change summaries and historical amendments.
  context: Exploratory meeting demonstration.
  authority_requirement: Official source evidence, independent project presentation.
  required_evidence:
  - Source URL, document title and role, observation timestamp, source digest and precise locator.
  freshness_tolerance: The named 15 September 2026 snapshot only; no operational freshness claim.
  likely_confusions:
  - Pension Credit versus State Pension.
  - Document update date versus rule effective date.
  - Source paragraphs versus editorial labels.
  consequences_of_error:
  - Misdirected research or inappropriate reliance on historical content.
  hard_failures:
  - A personalised entitlement answer or unsupported law/conformance claim.
  success: The reader recognises the document role and does not infer a current legal rule from an old amendment.
- id: TASK-AI
  user_ids:
  - USER-REVIEWER
  - USER-AI
  goal: Ask a bounded evidence question and inspect the cited evidence.
  context: Exploratory meeting demonstration.
  authority_requirement: Official source evidence, independent project presentation.
  required_evidence:
  - Source URL, document title and role, observation timestamp, source digest and precise locator.
  freshness_tolerance: The named 15 September 2026 snapshot only; no operational freshness claim.
  likely_confusions:
  - Pension Credit versus State Pension.
  - Document update date versus rule effective date.
  - Source paragraphs versus editorial labels.
  consequences_of_error:
  - Misdirected research or inappropriate reliance on historical content.
  hard_failures:
  - A personalised entitlement answer or unsupported law/conformance claim.
  success: The answer is traceable or explicitly states that the corpus cannot determine it.
