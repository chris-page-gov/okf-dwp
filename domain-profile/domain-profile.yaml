semantic_model:
  entity_types:
  - id: TYPE-COLLECTION
    label: Guidance collection
    source_native_type: GOV.UK publication page
    proposed_class: Use DCMI/PROV document provenance and local typed navigation; no claim of a legal ontology.
    identity_key: Publication URL
    version_key: Source digest plus acquisition snapshot; printed dates remain separate.
    required_properties:
    - Stable IRI
    - Human label
    - en-GB label language
    - Source URL
    - Derivation
    - Evidence locator
    optional_properties:
    - Source-native paragraph identifier
    - Explicit effective date if evidenced
    examples: []
    excluded_conflations:
    - Work, file version, source-native paragraph and extracted passage are different entities.
    task_refs:
    - TASK-FIND
    - TASK-EVIDENCE
    evidence_refs:
    - EV-COLLECTION
  - id: TYPE-DOCUMENT
    label: Guidance document
    source_native_type: Named chapter, summary or amendment
    proposed_class: Use DCMI/PROV document provenance and local typed navigation; no claim of a legal ontology.
    identity_key: Collection attachment URL plus observed document role
    version_key: Source digest plus acquisition snapshot; printed dates remain separate.
    required_properties:
    - Stable IRI
    - Human label
    - en-GB label language
    - Source URL
    - Derivation
    - Evidence locator
