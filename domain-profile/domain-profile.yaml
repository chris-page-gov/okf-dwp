architecture:
  profile_level: minimal-okf
  bundle_shape: small-markdown
  canonical_authoring: markdown-yaml-ld
  generated_representations:
  - okf-small-bundle
  - okf-explorer-descriptor
  - yaml-ld
  - json-ld
  refresh_strategy: Manual snapshot rebuild from the nominated page; keep prior receipts and create a new snapshot
    identity on source change.
  namespace_strategy: https://chris-page-gov.github.io/okf-dwp/id/
  scale_assumptions: 36 source PDFs; paragraph/passage count is a separate derived denominator. Start with source-linked
    chapter navigation and bounded passage retrieval. Richer OKF+ features are experimental additions; governed-semantic
    release conditions are not all met.
enrichment:
  enabled: true
  purpose: Model-assisted discovery and editorial navigation labels for the demonstration, visibly candidate until
    independent review.
  permitted_derivations:
  - source-native
  - normalized
  - model-assisted
  evidence_requirement: Every generated summary or relationship cites the admitted source and locator, identifies
    derivation and retains review state.
  independent_review: Separate pensions representative/domain review is outstanding.
  authority_boundary: No generated assertion acquires DWP or legal authority.
  budget: The user authorised parallel Codex agents for this task; no external paid API or claimant-data workflow
    is implied.
validation:
- id: VAL-PROFILE
  target: Discovery profile structure
  method: Validate JSON Schema 2020-12 and YAML/JSON equality.
  validator: jsonschema against the vendored pinned Explorer schema
  severity: error
  release_gate: true
  receipt: domain-profile/validation.json
- id: VAL-001
  target: Source evidence and deterministic bundle
  method: Check source inventory hashes, extraction provenance, record references and reproducible generated bytes.
  validator: Repository build/check commands recorded by the root agent
  severity: error
  release_gate: true
  receipt: validation/build.json
- id: VAL-CONSUMER-001
  target: Actual Explorer loading
  method: Run the pinned real Explorer against generated bytes and inspect overview, record and source navigation.
  validator: Actual Explorer; see consumer-lock.json
  severity: error
  release_gate: true
  receipt: validation/explorer.json
- id: VAL-DEPLOY-001
  target: Public entrypoints
  method: Open exact published links and verify bundle identity and source navigation before claiming readiness.
  validator: Real browser and bounded public HTTP checks
  severity: error
  release_gate: true
  receipt: validation/public-links.json
evaluation:
  competency_questions:
  - id: CQ-001
    question: Where should I look for guidance on earnings and income other than earnings?
    task_refs:
    - TASK-FIND
    expected_evidence: Chapter 86 and chapter 85 source labels and source PDFs.
    near_miss_rule: A shared word match without distinguishing the two chapters fails.
    verification_status: candidate
  - id: CQ-002
    question: Which PDF and page supports this paragraph?
    task_refs:
    - TASK-EVIDENCE
    expected_evidence: Document title, source URL, SHA-256, paragraph/page locator.
    near_miss_rule: A generated summary without a source locator fails.
    verification_status: candidate
  - id: CQ-003
    question: Is this amendment a current rule or a historical document?
    task_refs:
    - TASK-TIME
    expected_evidence: Source role, labelled amendment date and original PDF.
    near_miss_rule: Do not infer current legal effect from attachment availability.
    verification_status: candidate
  - id: CQ-004
    question: Can this bundle tell me whether a particular person qualifies today?
    task_refs:
    - TASK-AI
    expected_evidence: The non-goal and scope boundaries; signpost official guidance.
    near_miss_rule: It must abstain from a personalised decision.
    verification_status: candidate
  - id: CQ-005
    question: Does the source page cover every relevant law and DMG memo?
    task_refs:
    - TASK-AI
    expected_evidence: Named collection denominator and declared omissions.
    near_miss_rule: A completeness claim beyond the linked-PDF census fails.
    verification_status: candidate
  hard_failures:
  - Uncited source claims
  - Personalised entitlement determinations
  - Historical text presented as a current legal rule
  - Official endorsement or unrun validation claimed
  strata:
  - Chapter discovery
  - Paragraph/source inspection
  - Historical amendments
  - Missing or external reference
  - Deliberately unanswerable eligibility request
  citation_policy: Cite the admitted PDF and precise available locator; distinguish source wording from editorial
    explanation.
  independent_verification: Questions and expected evidence are model-assisted candidates; independent pensions
    review is outstanding.
  baselines:
  - Manual inspection of the DWP landing page and its PDFs.
  metrics:
  - Correct chapter retrieval
  - Resolvable evidence citation rate
  - Explicit abstention on out-of-scope requests
  thresholds:
  - Zero hard failures in the demonstrated journeys.
  challenge_policy: The meeting is a bounded exploratory review; two independent held-out release passes remain
    deferred.
constraints:
- id: CON-LAW
  kind: other
  effect: A guidance snapshot cannot establish current entitlement or complete applicable law.
  mitigation: Exclude decision automation; preserve historical/effective-date distinctions and source links.
  owner: Repository maintainer
  disposition: recorded
  evidence_refs:
  - EV-COLLECTION
  - EV-SPCA
- id: CON-PDF
  kind: technical
  effect: PDF extraction can alter reading order, tables and footnote context.
  mitigation: Keep original source links and locators; sample source layout; mark extraction limitations.
  owner: Repository maintainer
  disposition: recorded
  evidence_refs:
  - EV-COLLECTION
- id: CON-ACCESS
  kind: access
  effect: The DCMI and JSON Schema primary reference GETs returned HTTP 403.
  mitigation: Retain failure receipts and use the pinned local schema for structural validation; do not claim reference-body
    verification.
  owner: Repository maintainer
  disposition: recorded
  evidence_refs:
  - EV-DCTERMS
  - EV-JSONSCHEMA
gaps:
- id: GAP-LEGAL
  description: Provision-level legal citations, commencement, outstanding effects and external DMG memos are not
    reconciled.
  impact: No legal completeness or current entitlement claim.
  blocking: false
  owner: Repository maintainer / pensions domain reviewer
  next_action: Review explicit references and add law snapshots under a separate approved scope.
- id: GAP-REVIEW
  description: No independent pensions expert review or held-out answer evaluation has occurred.
  impact: Editorial meaning and candidate answers remain provisional.
  blocking: false
  owner: Repository maintainer / pensions domain reviewer
  next_action: Use the meeting to review a small sourced question set.
- id: GAP-ASSURANCE
  description: Full Foundry tiny-fixture, bidirectional compatibility, per-plane roots, SHACL and independent conformance
    are incomplete.
  impact: This is an experimental scaffold and bounded demonstration.
  blocking: false
  owner: Repository maintainer / pensions domain reviewer
  next_action: Run the applicable gates before promoting a production candidate.
- id: GAP-TIME
  description: The advisers guide contains subsection-level temporal labels that need expert checking, including
    rates labelled April 2024 within a guide headed April 2026.
  impact: A title or update date must not govern every figure in a document.
  blocking: false
  owner: Repository maintainer / pensions domain reviewer
  next_action: Record source-native dates; verify per provision before extracting executable rules.
- id: GAP-STANDARDS
  description: Two primary standards-reference retrievals returned HTTP 403.
  impact: Their bodies have not been verified through that route.
  blocking: false
  owner: Repository maintainer / pensions domain reviewer
  next_action: Retain the evidence gap; separately review canonical references when accessible.
decisions:
- id: DEC-EXPERIMENT
  question: What can be published for the meeting?
  recommended_default: A public, snapshot-bound independent exemplar with visible evidence and limitations.
  alternatives:
  - Wait for full expert-reviewed production assurance.
  consequences:
  - Demonstrates feasible discovery and retrieval; does not approve legal interpretations or unrun release gates.
  status: accepted
  owner: User
  blocking_for_build: false
  due_point: Explicitly authorised in the task on 15 September 2026.
  evidence_refs:
  - EV-OWNER
- id: DEC-SEMANTICS
  question: How much ontology should this first exemplar introduce?
  recommended_default: Small document/passage/topic vocabulary with DCMI and PROV relationships; preserve native
    legal citations.
  alternatives:
  - Full legal-rule model after independent domain review.
  consequences:
  - Avoids ungrounded identity and legal entailment; richer mappings remain review work.
  status: accepted
  owner: Profile author within the authorised prototype scope
  blocking_for_build: false
  due_point: This exploratory snapshot.
  evidence_refs:
  - EV-COLLECTION
  - EV-PROV
