presentation_contract:
  default_language: en-GB
  label_priority:
  - Reviewed source-native preferred label
  - Reviewed domain-profile preferred label
  - Deterministic editorial display label with explicit derivation
  - Visible missing-label defect; expose the identifier only through inspection
  graph_reachable_label_rule: Every graph-reachable entity must have a concise human label, language and label authority
    available without full-record hydration.
  identifier_fallback: debug-only
  compact_label_index:
    schema: okf-explorer-endpoint-label-index.v1
    descriptor_entrypoint: endpoint_labels
    manifest_index: endpoint_labels
    path: data/labels/index.json
    snapshot_bound: true
    integrity_bound: true
    missing_label_display: Missing label
  relationship_display_rule: Predicates must read naturally in context and semantic/compatibility projections must
    not create unexplained duplicate edges.
  citizen_checks:
  - Show source titles, paragraph identifiers with readable labels and explicit document roles.
  - No opaque IRI alone as the default graph-node label.
  - Keep experimental status and original source links visible.
exploratory_publication:
  enabled: true
  descriptor_schema: okf-exploratory-publication.v1
  publication_state: exploratory
  publisher:
    name: Chris Page — independent OKF exemplar
    url: https://github.com/chris-page-gov/okf-dwp
    authority_status: independent-research
  banner:
    label: Exploratory
    message: This is an incomplete research view, not an authoritative service or released data product. Content
      and links may change. Check the cited official source before making a decision.
    feedback_url: https://github.com/chris-page-gov/okf-dwp/issues/new
    preserve_route: true
  indexing_policy: noindex
  snapshot_bound: true
  plane_root_bound: true
  invalid_contract_policy: explicit-warning-and-noindex
  snapshot_policy: Every shared iteration receives an immutable snapshot identifier and retains the applicable plane
    roots.
  limitations:
  - No expert sign-off, legal consolidation, completeness or production conformance claim.
  - PDF extraction and semantic links need review; historical amendments are retained as historical evidence.
  permitted_claims:
  - A bounded public demonstration of source-linked discovery and inspectable YAML-LD.
  prohibited_claims:
  - Official endorsement, personalised benefit advice, automatic entitlement decisions, complete pension law or
    independently assured OKF+ production conformance.
  promotion_rule: Owner review creates a fresh candidate; exploratory bytes are never silently relabelled as a release
    candidate.
