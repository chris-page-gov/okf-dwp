name: Validate experimental OKF bundle

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: '0.12.2'
      - run: uv sync --locked
      - name: Verify deterministic generated bytes
        run: uv run --locked python scripts/build_bundle.py --check
      - name: Validate every source and semantic assertion
        run: uv run --locked python scripts/validate_bundle.py
      - name: Validate the discovery handoff
        run: uv run --locked python domain-profile/validate.py
      - name: Check retrieval and citation controls
        run: uv run --locked python scripts/evaluate_queries.py
      - name: Check semantic evidence and preserved identities
        run: uv run --locked python scripts/evaluate_semantics.py
      - name: Check wider source metadata census
        run: python3 source/discovery-2026-09-15/acquire_metadata.py --check
      - name: Check whitespace
        run: git diff --check
