name: Validate experimental OKF bundle

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The complete frozen-source and consumer replay exceeded 30 minutes on
    # merged learning release bd945377. Keep every check with bounded headroom.
    timeout-minutes: 45
    env:
      # Reviewed immutable consumer source; execution receipts bind its bytes too.
      EXPLORER_LOGICAL_UNIT_COMMIT: 982010e760573be5bc7aaa94b255541b5541ab08
      EXPLORER_CONTEXT_COMMIT: 97f13d22b689d92cd785de04758fe932d4a4d369
      EXPLORER_CORPUS_COMMIT: 31ee08ec259e165a478e9c36826fe3721643631d
      EXPLORER_STAFF_COMMIT: f8daf84a4c04afb4839695d38a97cbf21b0ed0a0
      EXPLORER_HOUSEHOLD_COMMIT: 0e6a639f87c4060123b72d82c1ebe30405d475f1
      EXPLORER_QUALIFICATION_COMMIT: c4f2de0a99b7bc2f8b8c8a06a3c715fb56b66d8e
      EXPLORER_QUALIFICATION_BASELINE_COMMIT: b9a3b68b6dbf222f9a73cc8f450dd53f126e1b55
      DWP_QUALIFICATION_COMMIT: 7f9feb9634e3d94004853b838462aca132c505a5
      DWP_DISABILITY_COMMIT: 8ea4465a4cb5a867d82c87e635f2ef1d1df18d8a
      DWP_IGNORED_PERSON_COMMIT: c44bc3a111d18b6d4098a148a9a1b67c1411882b
      DWP_DISABILITY_PUBLIC_COMMIT: df352daa5d1d6a99a30fddcb2db341f74c6473e5
      DWP_PARTNER_COMMIT: 7e5fdb9b906052914b307c17c0fd19feb2d008a7
      DWP_HOUSEHOLD_TRIAL_COMMIT: 3ef0e786e9a18e76fa17c7d925ff509d6d6c9f84
      DWP_COMPACT_TRIAL_COMMIT: 78a8beea97242d646eb9159860dea190ca5e2998
      DWP_DIRECT_TRIAL_COMMIT: d0251f0c9c757e082ac36ade47892a7c3d272a6d
      DWP_DIRECT_V4_TRIAL_COMMIT: afeb78d1241c03c73adb593a07614cf53634eb0b
      DWP_DIRECT_SOURCE_COMMIT: 723bcc5b015ab38a026625c2148edbd784edf7c7
      EXPLORER_DIRECT_RUNTIME_COMMIT: 0472b75a9dd353d6094a83ca9f752c4d78914168
      EXPLORER_DIRECT_VERIFIER_COMMIT: 03d0264c02a6d59d75013df4bffba279b3d4aa9c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: '0.12.2'
      - run: uv sync --locked
      - name: Validate the isolated learning-site renderer
        run: |
          uv sync --locked --project tools/learning-site
          uv run --locked --project tools/learning-site python -m unittest discover -s tools/learning-site -p test_learning_site.py
      - name: Keep private correspondence outside Git
        run: uv run --locked python scripts/check_private_inputs.py
      - name: Validate the canonical repository contracts
        run: uv run --locked python scripts/check_semantic_contract.py
      - name: Check backlog references before expensive corpus verification
        run: |
          uv run --locked python scripts/check_backlog.py
          uv run --locked python scripts/build_backlog_work_packages.py --check
      - name: Verify retained public-browser evidence offline
        run: uv run --locked python scripts/check_browser_evidence.py
      - name: Verify the retained learning-site publication offline
        run: |
          uv run --locked python scripts/check_learning_site_observation.py
          uv run --locked python validation/learning-site/public-7815b17bb3db3903738c745d3fb9508919ebab15/check_observation.py
          uv run --locked python -m unittest discover -s validation/learning-site/public-7815b17bb3db3903738c745d3fb9508919ebab15 -p test_verify_public.py
          uv run --locked python validation/learning-site/public-91b9907836c8a340d974dd958969f4f8cbb3a0c6/check_observation.py
          uv run --locked python -m unittest discover -s validation/learning-site/public-91b9907836c8a340d974dd958969f4f8cbb3a0c6 -p test_verify_public.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'
      - name: Verify approved retained examples and bounded public-verifier controls offline
        run: |
          uv run --locked --project tools/learning-site python scripts/build_learning_site.py --commit "$GITHUB_SHA" --check-examples
          node --test scripts/test_learning_site_v2.mjs
          node --test scripts/test_retained_examples_browser.mjs
      - name: Require an immutable context consumer commit
        run: >-
          uv run --locked python -c
          'import os,re; value=os.environ["EXPLORER_CONTEXT_COMMIT"]; assert re.fullmatch(r"[0-9a-f]{40}", value), "Set EXPLORER_CONTEXT_COMMIT to a reviewed immutable Explorer commit before publication"'
      - name: Check out the pinned context consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: ${{ env.EXPLORER_CONTEXT_COMMIT }}
          path: .ci/okf-explorer
          persist-credentials: false
      - name: Verify the consumer checkout identity
        run: test "$(git -C .ci/okf-explorer rev-parse HEAD)" = "$EXPLORER_CONTEXT_COMMIT"
      - name: Check out the independently pinned full-corpus consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: ${{ env.EXPLORER_CORPUS_COMMIT }}
          path: .ci/okf-explorer-corpus
          persist-credentials: false
      - name: Verify the full-corpus consumer checkout identity
        run: test "$(git -C .ci/okf-explorer-corpus rev-parse HEAD)" = "$EXPLORER_CORPUS_COMMIT"
      - name: Check out the additive staff-context consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: ${{ env.EXPLORER_STAFF_COMMIT }}
          path: .ci/okf-explorer-staff
          persist-credentials: false
      - name: Verify the staff consumer checkout identity
        run: test "$(git -C .ci/okf-explorer-staff rev-parse HEAD)" = "$EXPLORER_STAFF_COMMIT"
      - name: Check out the separate household-context consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: ${{ env.EXPLORER_HOUSEHOLD_COMMIT }}
          path: .ci/okf-explorer-household
          persist-credentials: false
      - name: Verify the household consumer checkout identity
        run: test "$(git -C .ci/okf-explorer-household rev-parse HEAD)" = "$EXPLORER_HOUSEHOLD_COMMIT"
      - name: Check out the separate qualification-context consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: ${{ env.EXPLORER_QUALIFICATION_COMMIT }}
          path: .ci/okf-explorer-qualification
          persist-credentials: false
      - name: Verify the qualification consumer checkout identity
        run: test "$(git -C .ci/okf-explorer-qualification rev-parse HEAD)" = "$EXPLORER_QUALIFICATION_COMMIT"
      - name: Check out the separate logical-unit consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: ${{ env.EXPLORER_LOGICAL_UNIT_COMMIT }}
          path: .ci/okf-explorer-logical-units
          persist-credentials: false
      - name: Verify logical evidence units and fixed-source context comparison
        run: |
          test "$(git -C .ci/okf-explorer-logical-units rev-parse HEAD)" = "$EXPLORER_LOGICAL_UNIT_COMMIT"
          uv run --locked python scripts/build_logical_units.py --check
          uv run --locked python scripts/build_logical_context.py --check
          uv run --locked python -m unittest discover -s scripts -p 'test_logical*.py'
          node --experimental-strip-types scripts/evaluate_logical_context.mjs --check --explorer-root .ci/okf-explorer-logical-units
      - name: Install locked context evaluator dependencies
        run: uv sync --locked --project .ci/okf-explorer
      - name: Install source verification tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Fetch the public observation source before receipt unit tests
        run: |
          git fetch --no-tags --depth=1 origin "$DWP_QUALIFICATION_COMMIT"
          git cat-file -e "$DWP_QUALIFICATION_COMMIT^{commit}"
      - name: Check acquisition and evidence boundaries
        run: uv run --locked python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify all full-DMG source identities and measured pages
        run: uv run --locked python scripts/acquire_full_dmg.py --check
      - name: Verify frozen ADM source identities and measured pages
        run: uv run --locked python scripts/acquire_adm.py --check
      - name: Verify all authored and indexed relationships
        run: uv run --locked python scripts/audit_relationships.py --check
      - name: Verify the full-source context projections
        run: |
          uv run --locked python scripts/build_context_discovery.py --check
          uv run --locked python scripts/build_context_corpus.py --check
          uv run --locked python scripts/build_context_corpus_explorer.py --check
      - name: Verify conceptual navigation and bounded staff review packs
        run: |
          uv run --locked python scripts/build_review_navigation.py --check
          uv run --locked python scripts/build_staff_review_packs.py --check
      - name: Verify additive staff semantics, legal references and both-manual Reader
        run: |
          uv run --locked python scripts/build_staff_needs.py --check
          uv run --locked python scripts/build_legal_reconciliation.py --check
          uv run --locked python scripts/build_legal_body_evidence.py --check
          uv run --locked python scripts/build_staff_semantic.py --check
          uv run --locked python scripts/build_combined_reader.py --check
          uv run --locked python scripts/compare_source_census.py --check
          uv run --locked python scripts/check_combined_reader_observations.py
      - name: Replay staff semantic development cases and failure controls
        run: node --experimental-strip-types scripts/evaluate_staff_semantic.mjs --check --explorer-root .ci/okf-explorer-qualification
      - name: Check abroad paraphrases, scope and whole-passage retention
        run: |
          git fetch --no-tags --depth=1 origin "$DWP_DIRECT_SOURCE_COMMIT"
          node --experimental-strip-types scripts/evaluate_abroad_semantic.mjs --explorer-root .ci/okf-explorer-qualification
      - name: Check the portable public-reader verifier without network
        run: |
          node --test scripts/test_staff_service_browser.mjs
          uv run --locked python scripts/check_staff_service_observations.py
          uv run --locked python scripts/check_staff_service_observations.py --directory validation/compact-delivery/v0.5.0
          uv run --locked python -m unittest discover -s scripts -p test_staff_service_observations.py
          node scripts/check_staff_service_browser.mjs --service-url https://ask-okf.crpage.chatgpt.site --sdk-receipt validation/compact-delivery/v0.4.0/sdk-receipt.json --deployment validation/compact-delivery/v0.4.0/deployment.json --check-inputs
          node scripts/check_staff_service_browser.mjs --service-url https://ask-okf.crpage.chatgpt.site --sdk-receipt validation/compact-delivery/v0.5.0/sdk-receipt.json --deployment validation/compact-delivery/v0.5.0/deployment.json --check-inputs
      - name: Verify identical staff trial inputs and retained outcomes offline
        run: |
          node --experimental-strip-types scripts/export_staff_trial_contexts.mjs --check --explorer-root .ci/okf-explorer-staff
          uv run --locked python scripts/run_staff_model_trials.py --report --check-report
      - name: Retain the immutable pre-merge household trial source for replay
        run: |
          git fetch --no-tags --depth=1 origin "$DWP_HOUSEHOLD_TRIAL_COMMIT"
          git cat-file -e "$DWP_HOUSEHOLD_TRIAL_COMMIT^{commit}"
          git fetch --no-tags --depth=1 origin "$DWP_COMPACT_TRIAL_COMMIT"
          git cat-file -e "$DWP_COMPACT_TRIAL_COMMIT^{commit}"
      - name: Fetch the frozen qualification comparison inputs
        run: |
          git cat-file -e "$DWP_QUALIFICATION_COMMIT^{commit}"
          git fetch --no-tags --depth=1 origin "$DWP_DISABILITY_COMMIT"
          git cat-file -e "$DWP_DISABILITY_COMMIT^{commit}"
          git fetch --no-tags --depth=1 origin "$DWP_IGNORED_PERSON_COMMIT"
          git cat-file -e "$DWP_IGNORED_PERSON_COMMIT^{commit}"
          git fetch --no-tags --depth=1 origin "$DWP_DISABILITY_PUBLIC_COMMIT"
          git cat-file -e "$DWP_DISABILITY_PUBLIC_COMMIT^{commit}"
          git fetch --no-tags --depth=1 origin "$DWP_PARTNER_COMMIT"
          git cat-file -e "$DWP_PARTNER_COMMIT^{commit}"
          git -C .ci/okf-explorer-qualification fetch --no-tags --depth=1 origin "$EXPLORER_QUALIFICATION_BASELINE_COMMIT"
          git -C .ci/okf-explorer-qualification cat-file -e "$EXPLORER_QUALIFICATION_BASELINE_COMMIT^{commit}"
      - name: Verify the exact direct-trial freeze without calling a provider
        run: |
          git fetch --no-tags --depth=1 origin "$DWP_DIRECT_TRIAL_COMMIT" "$DWP_DIRECT_SOURCE_COMMIT"
          git -C .ci/okf-explorer-qualification fetch --no-tags --depth=1 origin "$EXPLORER_DIRECT_RUNTIME_COMMIT" "$EXPLORER_DIRECT_VERIFIER_COMMIT"
          uv run --locked python -m unittest discover -s scripts -p test_monday_direct_trials.py
          uv run --locked python scripts/run_monday_direct_trials.py --explorer-root .ci/okf-explorer-qualification
          uv run --locked python -m unittest discover -s scripts -p test_monday_direct_observations.py
          uv run --locked python scripts/check_monday_direct_observations.py --explorer-root .ci/okf-explorer-qualification
      - name: Verify the latest recorded service status offline
        run: |
          uv run --locked python scripts/build_service_publication.py --receipt-commits > "$RUNNER_TEMP/service-publication-commits"
          while IFS= read -r receipt_commit; do
            git fetch --no-tags --depth=1 origin "$receipt_commit"
          done < "$RUNNER_TEMP/service-publication-commits"
          uv run --locked python scripts/build_service_publication.py --check
          uv run --locked python -m unittest discover -s scripts -p test_service_publication.py
      - name: Verify the v4 paired outputs without calling a provider
        run: |
          git fetch --no-tags --depth=1 origin "$DWP_DIRECT_V4_TRIAL_COMMIT"
          uv run --locked python scripts/run_monday_direct_v4_trials.py --explorer-root .ci/okf-explorer-qualification
          uv run --locked python scripts/check_monday_direct_v4_observations.py --explorer-root .ci/okf-explorer-qualification
      - name: Replay the independent source and allocator comparison offline
        run: |
          node --test validation/qualification-context/2026-09-21/admission.test.mjs validation/qualification-context/2026-09-21/metrics.test.mjs
          node --experimental-strip-types validation/qualification-context/2026-09-21/compare.mjs --dwp-root . --explorer-root .ci/okf-explorer-qualification --check validation/qualification-context/2026-09-21/attempt-01
      - name: Replay the separate disability qualification comparison offline
        run: |
          node --test validation/disability-context/2026-09-21/admission.test.mjs validation/disability-context/2026-09-21/metrics.test.mjs
          node --experimental-strip-types validation/disability-context/2026-09-21/compare.mjs --dwp-root . --explorer-root .ci/okf-explorer-qualification --check validation/disability-context/2026-09-21/attempt-01
      - name: Replay the separate partner qualification comparison offline
        run: |
          node --test validation/partner-context/2026-09-21/admission.test.mjs validation/partner-context/2026-09-21/metrics.test.mjs
          node --experimental-strip-types validation/partner-context/2026-09-21/compare.mjs --dwp-root . --explorer-root .ci/okf-explorer-qualification --check validation/partner-context/2026-09-21/attempt-01
      - name: Replay the separate ignored-person capacity comparison offline
        run: |
          node --test validation/ignored-person-context/2026-09-21/admission.test.mjs validation/ignored-person-context/2026-09-21/metrics.test.mjs validation/ignored-person-context/2026-09-21/diagnostics.test.mjs validation/ignored-person-context/2026-09-21/bytes.test.mjs
          node --experimental-strip-types validation/ignored-person-context/2026-09-21/compare.mjs --dwp-root . --explorer-root .ci/okf-explorer-qualification --check validation/ignored-person-context/2026-09-21/attempt-01
      - name: Verify portable performance evidence and new trial controls offline
        run: |
          node validation/context-performance/2026-09-21/verify.mjs
          node --test scripts/test_monday_trial_export.mjs
          node --experimental-strip-types scripts/export_monday_trial_contexts.mjs --check-preregistration
          node --experimental-strip-types scripts/export_monday_trial_contexts.mjs --check --explorer-root .ci/okf-explorer-household
          uv run --locked python scripts/run_monday_model_trials.py --check-report
          uv run --locked python scripts/project_monday_model_contexts.py
          uv run --locked python scripts/run_monday_compact_trials.py
          uv run --locked python scripts/run_monday_compact_trials.py --check-report
          uv run --locked python scripts/check_monday_compact_critique.py
      - name: Verify retained household browser observations offline
        run: |
          node --test scripts/test_household_reader_browser.mjs
          uv run --locked python scripts/check_household_reader_observations.py
          uv run --locked python -m unittest discover -s scripts -p test_household_reader_observations.py
      - name: Verify retained public household Reader observations offline
        run: |
          node --test scripts/test_public_household_reader.mjs
          uv run --locked python scripts/check_public_household_observations.py
          uv run --locked python -m unittest discover -s scripts -p test_public_household_observations.py
          uv run --locked python scripts/check_pinned_public_household_observation.py
          uv run --locked python scripts/test_pinned_public_household_observation.py
          uv run --locked python scripts/check_disability_public_observation.py
          uv run --locked python scripts/test_disability_public_observation.py
      - name: Check retained answer trials offline
        run: |
          uv run --locked python scripts/evaluate_fixed_answers.py
          uv run --locked python scripts/check_answer_review.py
          uv run --locked python scripts/check_compact_client.py
      - name: Verify source date and reference discovery
        run: uv run --locked python scripts/discover_full_dmg_evidence.py --check
      - name: Verify literal reference location reconciliation
        run: uv run --locked python scripts/reconcile_full_dmg_references.py --check
      - name: Verify indexed full-DMG generated bytes
        run: uv run --locked python scripts/build_full_dmg.py --check
      - name: Validate every indexed source page, token and assertion
        run: uv run --locked python scripts/validate_full_dmg.py
      - name: Run pinned Explorer acceptance functions
        run: node --experimental-strip-types scripts/check_full_dmg_consumer.mjs
      - name: Replay exact source and context acceptance
        run: node scripts/evaluate_context_assembly.mjs --explorer-root .ci/okf-explorer --check
      - name: Replay retained remote MCP evidence without contacting the service
        run: node --experimental-strip-types scripts/test_remote_mcp.mjs --explorer-root .ci/okf-explorer --check
      - name: Replay explicitly bounded remote MCP packages
        run: node --experimental-strip-types scripts/check_bounded_remote_mcp.mjs --explorer-root .ci/okf-explorer
      - name: Replay all supplied staff questions and source candidates
        run: node --experimental-strip-types scripts/evaluate_staff_questions.mjs --check --explorer-root .ci/okf-explorer
      - name: Reject altered staff evaluation evidence
        run: node --experimental-strip-types scripts/test_staff_questions.mjs --explorer-root .ci/okf-explorer
      - name: Replay full-corpus staff questions and scope controls
        run: node --experimental-strip-types scripts/evaluate_corpus_questions.mjs --check --explorer-root .ci/okf-explorer-corpus
      - name: Replay the bounded full-corpus ChatGPT demonstration package
        run: node --experimental-strip-types validation/corpus-questions/bounded-abroad/verify.mjs --check --explorer-root .ci/okf-explorer-corpus
      - name: Reject altered full-corpus evaluation evidence
        run: node --experimental-strip-types scripts/test_corpus_questions.mjs --explorer-root .ci/okf-explorer-corpus
      - name: Replay actual-index context failure controls
        run: >-
          node --experimental-strip-types .ci/okf-explorer/scripts/run_context_controls.mjs
          --index full-dmg/context/assembly-index.json
          --case evaluation/context-assembly/imprisonment-case.json
          --controls evaluation/context-assembly/imprisonment-controls.json
          --output evaluation/context-assembly/imprisonment-controls-execution.json
          --check
      - name: Reconcile source and semantic coverage
        run: uv run --locked python scripts/report_full_dmg_coverage.py --check
      - name: Replay indexed evidence and no-result controls
        run: uv run --locked python scripts/evaluate_full_dmg.py --check
      - name: Verify recorded model answers, grades and source evidence
        run: uv run --locked python scripts/verify_full_dmg_trials.py --check
      - name: Verify deterministic generated bytes
        run: uv run --locked python scripts/build_bundle.py --check
      - name: Validate every source and semantic assertion
        run: uv run --locked python scripts/validate_bundle.py
      - name: Validate the discovery handoff
        run: uv run --locked python domain-profile/validate.py
      - name: Check retrieval and citation controls
        run: uv run --locked python scripts/evaluate_queries.py
      - name: Check semantic evidence and preserved identities
        run: uv run --locked python scripts/evaluate_semantics.py
      - name: Check wider source metadata census
        run: python3 source/discovery-2026-09-15/acquire_metadata.py --check
      - name: Check whitespace
        run: git diff --check
