name: Validate experimental OKF bundle

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Reviewed immutable consumer source; execution receipts bind its bytes too.
      EXPLORER_CONTEXT_COMMIT: 97f13d22b689d92cd785de04758fe932d4a4d369
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: '0.12.2'
      - run: uv sync --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'
      - name: Require an immutable context consumer commit
        run: >-
          uv run --locked python -c
          'import os,re; value=os.environ["EXPLORER_CONTEXT_COMMIT"]; assert re.fullmatch(r"[0-9a-f]{40}", value), "Set EXPLORER_CONTEXT_COMMIT to a reviewed immutable Explorer commit before publication"'
      - name: Check out the pinned context consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: ${{ env.EXPLORER_CONTEXT_COMMIT }}
          path: .ci/okf-explorer
          persist-credentials: false
      - name: Verify the consumer checkout identity
        run: test "$(git -C .ci/okf-explorer rev-parse HEAD)" = "$EXPLORER_CONTEXT_COMMIT"
      - name: Install locked context evaluator dependencies
        run: uv sync --locked --project .ci/okf-explorer
      - name: Install source verification tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Check acquisition and evidence boundaries
        run: uv run --locked python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify all full-DMG source identities and measured pages
        run: uv run --locked python scripts/acquire_full_dmg.py --check
      - name: Verify source date and reference discovery
        run: uv run --locked python scripts/discover_full_dmg_evidence.py --check
      - name: Verify literal reference location reconciliation
        run: uv run --locked python scripts/reconcile_full_dmg_references.py --check
      - name: Verify indexed full-DMG generated bytes
        run: uv run --locked python scripts/build_full_dmg.py --check
      - name: Validate every indexed source page, token and assertion
        run: uv run --locked python scripts/validate_full_dmg.py
      - name: Run pinned Explorer acceptance functions
        run: node --experimental-strip-types scripts/check_full_dmg_consumer.mjs
      - name: Replay exact source and context acceptance
        run: node scripts/evaluate_context_assembly.mjs --explorer-root .ci/okf-explorer --check
      - name: Replay actual-index context failure controls
        run: >-
          node --experimental-strip-types .ci/okf-explorer/scripts/run_context_controls.mjs
          --index full-dmg/context/assembly-index.json
          --case evaluation/context-assembly/imprisonment-case.json
          --controls evaluation/context-assembly/imprisonment-controls.json
          --output evaluation/context-assembly/imprisonment-controls-execution.json
          --check
      - name: Reconcile source and semantic coverage
        run: uv run --locked python scripts/report_full_dmg_coverage.py --check
      - name: Replay indexed evidence and no-result controls
        run: uv run --locked python scripts/evaluate_full_dmg.py --check
      - name: Verify recorded model answers, grades and source evidence
        run: uv run --locked python scripts/verify_full_dmg_trials.py --check
      - name: Verify deterministic generated bytes
        run: uv run --locked python scripts/build_bundle.py --check
      - name: Validate every source and semantic assertion
        run: uv run --locked python scripts/validate_bundle.py
      - name: Validate the discovery handoff
        run: uv run --locked python domain-profile/validate.py
      - name: Check retrieval and citation controls
        run: uv run --locked python scripts/evaluate_queries.py
      - name: Check semantic evidence and preserved identities
        run: uv run --locked python scripts/evaluate_semantics.py
      - name: Check wider source metadata census
        run: python3 source/discovery-2026-09-15/acquire_metadata.py --check
      - name: Check whitespace
        run: git diff --check
